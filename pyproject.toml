[project]
name = "news-reel-agent"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "instructor>=1.5",
    "openai>=1.50",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "feedparser>=6.0",
    "httpx>=0.27",
    "edge-tts>=6.1",
    "playwright>=1.47",
    "imageio-ffmpeg>=0.5",
    "loguru>=0.7",
    "pillow>=10.0",
    "yt-dlp>=2024.8.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

