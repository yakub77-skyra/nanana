name: daily-reel
on:
  schedule:
    - cron: "20 2 * * *"     # 07:50 AM IST
  workflow_dispatch:          # manual "Run" button

permissions:
  contents: write             # agent pushes reels to Pages

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}   # PAT (repo scope) so it can push back
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install
        run: |
          pip install -e .
          playwright install --with-deps chromium
      - name: Run agent
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ALLOW_VIRAL_CLIPS: "true"
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: python main.py
      - name: Save reel backup
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: reel, path: output/reel_final.mp4 }